name: design-system

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Catálogo em dia
        run: node scripts/ds-index.mjs --check

      - name: Conjunto de referência aprovado
        run: node scripts/ds-check.mjs paginas/referencia
