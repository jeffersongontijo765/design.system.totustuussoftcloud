<!-- @dsCard group="Geral" height=360 subtitle="lozad 1.16.0 · data-src (img), data-background-image, data-toggle-class, rootMargin, triggerLoad; carregamento ao rolar" -->
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><title>Lozad</title>
<style>
  .lz-banner { height: 92px; border-radius: var(--ttsc-radius-surface); background-color: var(--ttsc-surface-2); background-size: cover; background-position: center; border: 1px solid var(--ttsc-border); display: flex; align-items: flex-end; padding: 10px 14px; transition: opacity .3s ease; }
  .lz-banner span { color: #fff; font-weight: 600; font-size: 14px; text-shadow: 0 1px 2px rgba(0,0,0,.5); }
  .lz-list { height: 196px; overflow-y: auto; border: 1px solid var(--ttsc-border); border-radius: var(--ttsc-radius-surface); background: var(--ttsc-surface); }
  .lz-row { display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-bottom: 1px solid var(--ttsc-border-soft); }
  .lz-row:last-child { border-bottom: 0; }
  .lz-avatar { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--ttsc-surface-2); border: 1px solid var(--ttsc-border-soft); opacity: .35; transition: opacity .3s ease; }
  .lz-avatar.is-loaded { opacity: 1; }
  .lz-name { color: var(--ttsc-text); font-weight: 500; font-size: 13px; }
  .lz-sub { color: var(--ttsc-text-muted); font-size: 12px; }
  .lz-state { margin-left: auto; font-size: 11px; color: var(--ttsc-text-muted); }
  .lz-row .is-loaded ~ .lz-state { color: var(--ttsc-accent-text); }
</style>
</head>
<body>
<div class="ds-pad ds-stack">
  <div class="lz-banner lozad" id="lz-banner" data-background-image="" data-background-delimiter="|" data-toggle-class="is-loaded" role="img" aria-label="Banner da Feira de Ciências 2026"><span>Feira de Ciências 2026 · inscrições abertas</span></div>
  <div class="ds-row" style="justify-content:space-between">
    <span class="ds-label">Alunos do 9º ano B · role a lista</span>
    <span class="ds-note" id="lz-count" aria-live="polite"></span>
  </div>
  <div class="lz-list" id="lz-list" tabindex="0" aria-label="Lista de alunos"></div>
</div>
<script src="../../vendor/lozad/lozad.min.js"></script>
<script>
  var PALETTE = ['#4f7cac', '#3ecf8e', '#e2a03f', '#a36bd1', '#d16b6b', '#2f9e9e'];
  function avatar(nome, i) {
    var ini = nome.split(' ').map(function (p) { return p[0]; }).slice(0, 2).join('');
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="72" height="72"><rect width="72" height="72" fill="' + PALETTE[i % PALETTE.length] + '"/>' +
      '<text x="36" y="45" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="600" fill="#fff" text-anchor="middle">' + ini + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  var banner = '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="120"><defs><linearGradient id="g" x2="1"><stop offset="0" stop-color="#16624a"/><stop offset="1" stop-color="#4f7cac"/></linearGradient></defs>' +
    '<rect width="900" height="120" fill="url(#g)"/><circle cx="780" cy="40" r="60" fill="#fff" opacity=".12"/><circle cx="700" cy="110" r="40" fill="#fff" opacity=".1"/></svg>';
  document.getElementById('lz-banner').setAttribute('data-background-image', 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(banner));

  var nomes = ['Alice Moura','Ana Beatriz Souza','Bruno Carvalho','Caio Fernandes','Camila Rocha','Diego Martins','Eduarda Lima','Felipe Araújo','Gabriela Nunes','Heitor Ribeiro','Isabela Castro','João Pedro Alves'];
  document.getElementById('lz-list').innerHTML = nomes.map(function (n, i) {
    return '<div class="lz-row"><img class="lz-avatar lozad" alt="Foto de ' + n + '" width="36" height="36" data-src="' + avatar(n, i) + '" data-toggle-class="is-loaded">' +
      '<div><div class="lz-name">' + n + '</div><div class="lz-sub">MAT-2026-' + String(101 + i).padStart(4, '0') + '</div></div><span class="lz-state">aguardando</span></div>';
  }).join('');

  var total = document.querySelectorAll('img.lozad').length, loaded = 0;
  function count() { document.getElementById('lz-count').textContent = 'Fotos carregadas: ' + loaded + ' de ' + total; }
  var observer = lozad('.lozad', {
    rootMargin: '0px 0px 40px 0px', threshold: 0.1,
    loaded: function (el) {
      if (el.tagName === 'IMG') { loaded++; count(); var s = el.parentElement.querySelector('.lz-state'); if (s) s.textContent = 'carregada'; }
    }
  });
  observer.observe();
  count();
  TTSC.init();
</script>
</body>
</html>
