<!-- @dsCard group="Componentes" height=210 subtitle="ttsc-toggle-group · segmentado (radio), múltipla escolha (.active), toolbar, compacto, desabilitado" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ButtonGroup</title>
<style>
  .ttsc-toggle-group { border-radius: var(--ttsc-radius-sm); }
  .ttsc-toggle-group .ttsc-btn { color: var(--ttsc-text); }
  .ttsc-toggle-group .ttsc-btn:has(input:checked), .ttsc-toggle-group .ttsc-btn.active { background: var(--ttsc-accent-soft); color: var(--ttsc-accent-text); font-weight: 600; box-shadow: inset 0 0 0 1px var(--ttsc-accent-border); }
  .ttsc-toggle-group .ttsc-btn:has(input:checked) i, .ttsc-toggle-group .ttsc-btn.active i { color: var(--ttsc-accent-text); }
  .ttsc-toggle-group .ttsc-btn:has(input:focus-visible) { outline: 2px solid var(--ttsc-accent); outline-offset: 2px; z-index: 1; }
  .ttsc-toggle-group .ttsc-btn:has(input:disabled) { opacity: .5; pointer-events: none; }
  .bg-grid { display: grid; grid-template-columns: 150px 1fr; gap: 14px 12px; align-items: center; }
</style>
</head>
<body>
<div class="ds-pad bg-grid">
  <div class="ds-label">Segmentado</div>
  <div class="ds-row">
    <div class="ttsc-toggle-group" role="radiogroup" aria-label="Visualização">
      <label class="ttsc-btn"><input type="radio" name="view" value="table" checked><i class="fa-light fa-table"></i> Tabela</label>
      <label class="ttsc-btn"><input type="radio" name="view" value="kanban"><i class="fa-light fa-square-kanban"></i> Kanban</label>
      <label class="ttsc-btn"><input type="radio" name="view" value="calendar"><i class="fa-light fa-calendar"></i> Calendário</label>
    </div>
    <span class="ds-note" id="bg-view">view=table</span>
  </div>

  <div class="ds-label">Compacto com contagem</div>
  <div class="ttsc-toggle-group" role="radiogroup" aria-label="Turno" style="justify-self:start">
    <label class="ttsc-btn ttsc-btn-sm"><input type="radio" name="shift" value="morning" checked>Manhã <span class="ttsc-badge ttsc-badge-xs ttsc-badge-secondary">412</span></label>
    <label class="ttsc-btn ttsc-btn-sm"><input type="radio" name="shift" value="afternoon">Tarde <span class="ttsc-badge ttsc-badge-xs ttsc-badge-secondary">286</span></label>
    <label class="ttsc-btn ttsc-btn-sm"><input type="radio" name="shift" value="night">Noite <span class="ttsc-badge ttsc-badge-xs ttsc-badge-secondary">331</span></label>
    <label class="ttsc-btn ttsc-btn-sm" aria-disabled="true"><input type="radio" name="shift" value="full" disabled>Integral</label>
  </div>

  <div class="ds-label">Múltipla escolha</div>
  <div class="ds-row">
    <div class="ttsc-toggle-group" role="group" aria-label="Filtrar status" data-ttsc-button-group="multiple" id="status-filter">
      <button type="button" class="ttsc-btn ttsc-btn-sm active" data-value="active">Ativas</button>
      <button type="button" class="ttsc-btn ttsc-btn-sm" data-value="locked">Trancadas</button>
      <button type="button" class="ttsc-btn ttsc-btn-sm active" data-value="conditional_pending">Condicionais</button>
    </div>
    <span class="ds-note" id="bg-status">status=active,conditional_pending</span>
  </div>

  <div class="ds-label">Toolbar</div>
  <div class="ds-row">
    <div class="ttsc-toggle-group" role="toolbar" aria-label="Navegação do calendário">
      <button type="button" class="ttsc-btn ttsc-btn-icon" aria-label="Semana anterior"><i class="fa-light fa-chevron-left"></i></button>
      <button type="button" class="ttsc-btn">Hoje</button>
      <button type="button" class="ttsc-btn ttsc-btn-icon" aria-label="Próxima semana"><i class="fa-light fa-chevron-right"></i></button>
    </div>
    <div class="ttsc-toggle-group" role="toolbar" aria-label="Exportar">
      <button type="button" class="ttsc-btn ttsc-btn-sm"><i class="fa-light fa-file-csv"></i> CSV</button>
      <button type="button" class="ttsc-btn ttsc-btn-sm"><i class="fa-light fa-file-pdf"></i> PDF</button>
      <button type="button" class="ttsc-btn ttsc-btn-sm"><i class="fa-light fa-file-excel"></i> XLSX</button>
    </div>
  </div>
</div>
<script>
  TTSC.init();
  document.querySelectorAll('input[name=view]').forEach(function (r) {
    r.addEventListener('change', function () { document.getElementById('bg-view').textContent = 'view=' + r.value; });
  });
  document.querySelectorAll('[data-ttsc-button-group]').forEach(function (group) {
    var btns = group.querySelectorAll('.ttsc-btn[data-value]');
    btns.forEach(function (b) { b.setAttribute('aria-pressed', b.classList.contains('active') ? 'true' : 'false'); });
    group.addEventListener('click', function (e) {
      var b = e.target.closest('.ttsc-btn[data-value]'); if (!b) return;
      var on = !b.classList.contains('active');
      b.classList.toggle('active', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
      var values = [].filter.call(btns, function (x) { return x.classList.contains('active'); }).map(function (x) { return x.dataset.value; });
      group.dispatchEvent(new CustomEvent('ttsc.buttongroup.change', { bubbles: true, detail: { value: b.dataset.value, values: values, button: b } }));
    });
  });
  document.addEventListener('ttsc.buttongroup.change', function (e) {
    document.getElementById('bg-status').textContent = 'status=' + (e.detail.values.join(',') || '(todos)');
  });
</script>
</body>
</html>
