<!-- @dsCard group="Componentes" height=330 subtitle="data-ttsc-dismiss · mode remove (alerta, filtros), mode hide (dica reabrível), eventos dismiss/dismissed" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Dismiss</title>
<style>
  .ttsc-dismissible { transition: opacity .2s ease; }
  @media (prefers-reduced-motion: reduce) { .ttsc-dismissible { transition: none; } }
  .ttsc-alert.ttsc-alert-info { background: color-mix(in oklab, var(--ttsc-info) 8%, var(--ttsc-surface)); border: 1px solid color-mix(in oklab, var(--ttsc-info) 30%, transparent); color: var(--ttsc-text); }
  .ttsc-alert.ttsc-alert-info .ttsc-alert-icon { color: var(--ttsc-info-text); }
  .ttsc-alert .ttsc-alert-description { color: var(--ttsc-text-2); }
  .ttsc-alert-close, .ttsc-badge-btn { color: var(--ttsc-text-muted); background: none; border: 0; cursor: pointer; }
  .ttsc-alert-close:hover, .ttsc-alert-close:focus-visible { color: var(--ttsc-text); }
  .ds-tip { display: flex; align-items: center; gap: 12px; background: var(--ttsc-surface); border: 1px solid var(--ttsc-border); border-radius: var(--ttsc-radius-sm); padding: 10px 12px 10px 16px; color: var(--ttsc-text-2); }
  .ds-tip > i { color: var(--ttsc-warning-text); }
  .ds-tip .ttsc-btn { margin-inline-start: auto; }
</style>
</head>
<body>
<div class="ds-pad ds-stack">
  <div class="ds-row" style="justify-content:space-between">
    <div class="ds-label">mode remove · alerta</div>
    <span class="ds-note" id="ds-log">evento: —</span>
  </div>
  <div class="ttsc-alert ttsc-alert-info ttsc-dismissible" id="aviso-1" role="status">
    <div class="ttsc-alert-icon"><i class="fa-light fa-circle-info"></i></div>
    <div class="ttsc-alert-content">
      <div class="ttsc-alert-title">Rematrícula 2027.1 aberta até 20/12</div>
      <div class="ttsc-alert-description">Assine o contrato pelo portal para garantir sua vaga na turma.</div>
    </div>
    <button type="button" class="ttsc-alert-close" data-ttsc-dismiss="#aviso-1" aria-label="Fechar aviso: Rematrícula aberta"><i class="fa-light fa-xmark"></i></button>
  </div>

  <div class="ds-label">mode remove · filtros aplicados</div>
  <div class="ds-row" id="filtros">
    <span class="ttsc-badge ttsc-badge-outline ttsc-badge-secondary ttsc-dismissible" id="f-curso">Curso: Pedagogia
      <button type="button" class="ttsc-badge-btn" data-ttsc-dismiss="#f-curso" aria-label="Remover filtro Curso: Pedagogia"><i class="fa-light fa-xmark"></i></button></span>
    <span class="ttsc-badge ttsc-badge-outline ttsc-badge-secondary ttsc-dismissible" id="f-turno">Turno: Noite
      <button type="button" class="ttsc-badge-btn" data-ttsc-dismiss="#f-turno" aria-label="Remover filtro Turno: Noite"><i class="fa-light fa-xmark"></i></button></span>
    <span class="ttsc-badge ttsc-badge-outline ttsc-badge-secondary ttsc-dismissible" id="f-status">Status: Ativa
      <button type="button" class="ttsc-badge-btn" data-ttsc-dismiss="#f-status" aria-label="Remover filtro Status: Ativa"><i class="fa-light fa-xmark"></i></button></span>
  </div>

  <div class="ds-label">mode hide · dica reabrível</div>
  <div class="ds-tip ttsc-dismissible" id="dica-kanban">
    <i class="fa-light fa-lightbulb"></i> Arraste os cards para mudar a etapa da matrícula.
    <button type="button" class="ttsc-btn ttsc-btn-ghost ttsc-btn-icon ttsc-btn-sm" data-ttsc-dismiss="#dica-kanban" data-ttsc-dismiss-mode="hide" aria-label="Esconder dica"><i class="fa-light fa-xmark"></i></button>
  </div>
  <div class="ds-row">
    <button type="button" class="ttsc-link ttsc-link-sm" id="show-tip">Mostrar dica</button>
    <button type="button" class="ttsc-link ttsc-link-sm" onclick="location.reload()">Restaurar exemplo</button>
  </div>
</div>
<script>
  TTSC.init();
  var log = document.getElementById('ds-log');
  document.addEventListener('dismiss', function (e) { log.textContent = 'evento: dismiss (' + e.target.getAttribute('data-ttsc-dismiss') + ')'; });
  document.addEventListener('dismissed', function (e) { log.textContent = 'evento: dismissed (' + e.target.getAttribute('data-ttsc-dismiss') + ')'; });
  document.getElementById('show-tip').addEventListener('click', function () { document.getElementById('dica-kanban').classList.remove('hidden'); });
</script>
</body>
</html>
