<!-- @dsCard group="Componentes" height=300 subtitle="TeamMemberCard · team member com estados, ações e acessibilidade (padrões de referência adaptados) " -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>TeamMemberCard</title>
<style>
  html,body{margin:0;background:var(--ttsc-canvas);color:var(--ttsc-text);font-family:Inter,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .demo{padding:16px;display:grid;gap:14px;max-width:1100px}
  .card{background:var(--ttsc-surface);border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-surface);padding:16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .card-t{margin:0;font-size:14px;font-weight:600;color:var(--ttsc-text)}
  .card-s{margin:2px 0 0;font-size:11px;color:var(--ttsc-text-muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--ttsc-radius-pill);border:1px solid var(--ttsc-border);color:var(--ttsc-text-2);white-space:nowrap;background:var(--ttsc-surface)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill-ok{color:var(--ttsc-success);border-color:color-mix(in srgb,var(--ttsc-success) 40%,transparent)}
  .pill-warn{color:var(--ttsc-warning-text);border-color:color-mix(in srgb,var(--ttsc-warning) 45%,transparent)}
  .pill-bad{color:var(--ttsc-danger-text);border-color:color-mix(in srgb,var(--ttsc-danger) 40%,transparent)}
  .pill-info{color:var(--ttsc-info-text);border-color:color-mix(in srgb,var(--ttsc-info) 40%,transparent)}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ttsc-accent-soft);color:var(--ttsc-accent-text);flex-shrink:0}
  .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--ttsc-border);background:var(--ttsc-surface);display:grid;place-items:center;color:var(--ttsc-text-2);cursor:pointer}
  .ib:hover{background:var(--ttsc-canvas-2)}
  .ib-ok:hover{color:var(--ttsc-success)} .ib-no:hover{color:var(--ttsc-danger-text)}
  .muted{color:var(--ttsc-text-muted)} .tnum{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--ttsc-accent);outline-offset:2px}

  .tm-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .tm{display:grid;gap:8px;padding:14px;border-radius:var(--ttsc-radius-surface);border:1px solid var(--ttsc-border);background:var(--ttsc-surface);text-align:left}
  .tm-top{display:flex;gap:10px;align-items:center}
  .tm-av{position:relative}
  .tm-av .dot{position:absolute;right:-1px;bottom:-1px;width:10px;height:10px;border-radius:50%;border:2px solid var(--ttsc-surface);background:var(--ttsc-success)}
  .tm-av .dot.off{background:var(--ttsc-text-muted)}
  .tm-name{font-size:13px;font-weight:600;color:var(--ttsc-text)}
  .tm-role{font-size:11px;color:var(--ttsc-text-muted)}
  .tm-meta{display:grid;gap:4px;font-size:11px;color:var(--ttsc-text-2)}
  .tm-meta span{display:flex;gap:6px;align-items:center}
  .tm-meta i{color:var(--ttsc-text-muted);width:14px}
</style>
</head>
<body>
<main class="demo">

  <section aria-labelledby="tm-t">
    <h2 id="tm-t" class="card-t" style="margin:0 0 10px">Corpo docente · Ensino Médio</h2>
    <div class="tm-grid">
      <article class="tm">
        <div class="tm-top"><span class="tm-av"><span class="av" style="width:40px;height:40px" aria-hidden="true">RP</span><span class="dot" role="img" aria-label="Disponível"></span></span>
          <div><div class="tm-name">Rafael Pereira</div><div class="tm-role">Matemática · 12 turmas</div></div></div>
        <div class="tm-meta"><span><i class="fa-light fa-envelope" aria-hidden="true"></i>rafael.pereira@escola.com</span><span><i class="fa-light fa-clock" aria-hidden="true"></i>Atendimento: seg e qua</span></div>
      </article>
      <article class="tm">
        <div class="tm-top"><span class="tm-av"><span class="av" style="width:40px;height:40px" aria-hidden="true">LC</span><span class="dot off" role="img" aria-label="Em licença"></span></span>
          <div><div class="tm-name">Letícia Campos</div><div class="tm-role">Língua Portuguesa · 8 turmas</div></div></div>
        <div class="tm-meta"><span><i class="fa-light fa-envelope" aria-hidden="true"></i>leticia.campos@escola.com</span><span><i class="fa-light fa-circle-pause" aria-hidden="true"></i>Em licença até 15/03</span></div>
      </article>
    </div>
  </section>

</main>
</body>
</html>
