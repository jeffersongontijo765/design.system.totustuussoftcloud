<!-- @dsCard group="Formulários" height=200 subtitle="ttsc-toggle-group · único (radio), múltiplo (checkbox), botões aria-pressed, só ícone, ênfase" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ToggleGroup</title>
<style>
  .ttsc-toggle-group.ttsc-toggle-group-a11y .ttsc-btn { position: relative; }
  .ttsc-toggle-group.ttsc-toggle-group-a11y .ttsc-btn input[type=radio],
  .ttsc-toggle-group.ttsc-toggle-group-a11y .ttsc-btn input[type=checkbox] { display: block; position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .ttsc-toggle-group .ttsc-btn:has(input:focus-visible) { outline: 2px solid var(--ttsc-accent); outline-offset: -2px; z-index: 1; }
  .ttsc-toggle-group .ttsc-btn:has(input:checked), .ttsc-toggle-group .ttsc-btn.active { font-weight: 600; }
  .ttsc-toggle-group .ttsc-btn:has(input:disabled) { opacity: .5; pointer-events: none; }
  .ttsc-toggle-group-accent .ttsc-btn:has(input:checked), .ttsc-toggle-group-accent .ttsc-btn.active { background: var(--ttsc-accent-soft); color: var(--ttsc-accent-text); }
  .ttsc-toggle-group-accent .ttsc-btn:has(input:checked) i { color: var(--ttsc-accent-text); }
  .pv-out { font-size: 12px; color: var(--ttsc-text-2); }
  .pv-lbl { width: 150px; }
</style>
</head>
<body>
<div class="ds-pad ds-stack">
  <div class="ds-row">
    <span class="ds-label pv-lbl">Único · visão</span>
    <div class="ttsc-toggle-group ttsc-toggle-group-a11y" role="radiogroup" aria-label="Visualização" id="pv-view">
      <label class="ttsc-btn ttsc-btn-sm"><input type="radio" name="view" value="table" checked><i class="fa-light fa-table" aria-hidden="true"></i> Tabela</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="radio" name="view" value="kanban"><i class="fa-light fa-square-kanban" aria-hidden="true"></i> Kanban</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="radio" name="view" value="calendar"><i class="fa-light fa-calendar" aria-hidden="true"></i> Calendário</label>
    </div>
    <span class="pv-out" id="pv-view-out">view=table</span>
  </div>
  <div class="ds-row">
    <span class="ds-label pv-lbl">Múltiplo · dias</span>
    <div class="ttsc-toggle-group ttsc-toggle-group-a11y" role="group" aria-label="Dias da semana" id="pv-days">
      <label class="ttsc-btn ttsc-btn-sm"><input type="checkbox" name="weekdays[]" value="1" checked> Seg</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="checkbox" name="weekdays[]" value="2"> Ter</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="checkbox" name="weekdays[]" value="3" checked> Qua</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="checkbox" name="weekdays[]" value="4"> Qui</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="checkbox" name="weekdays[]" value="5" checked> Sex</label>
      <label class="ttsc-btn ttsc-btn-sm"><input type="checkbox" name="weekdays[]" value="6" disabled> Sáb</label>
    </div>
    <span class="pv-out" id="pv-days-out"></span>
  </div>
  <div class="ds-row">
    <span class="ds-label pv-lbl">Botões · só ícone</span>
    <div class="ttsc-toggle-group" data-mode="buttons" role="group" aria-label="Formatação">
      <button type="button" class="ttsc-btn ttsc-btn-icon active" aria-pressed="true" aria-label="Negrito"><i class="fa-light fa-bold" aria-hidden="true"></i></button>
      <button type="button" class="ttsc-btn ttsc-btn-icon" aria-pressed="false" aria-label="Itálico"><i class="fa-light fa-italic" aria-hidden="true"></i></button>
      <button type="button" class="ttsc-btn ttsc-btn-icon" aria-pressed="false" aria-label="Sublinhado"><i class="fa-light fa-underline" aria-hidden="true"></i></button>
    </div>
  </div>
  <div class="ds-row">
    <span class="ds-label pv-lbl">Ênfase · turno</span>
    <div class="ttsc-toggle-group ttsc-toggle-group-a11y ttsc-toggle-group-accent" role="radiogroup" aria-label="Turno">
      <label class="ttsc-btn"><input type="radio" name="shift" value="morning"> Manhã</label>
      <label class="ttsc-btn"><input type="radio" name="shift" value="afternoon" checked> Tarde</label>
      <label class="ttsc-btn"><input type="radio" name="shift" value="evening"> Noite</label>
    </div>
  </div>
</div>
<script>
  TTSC.init();
  document.getElementById('pv-view').addEventListener('change', function (e) { document.getElementById('pv-view-out').textContent = 'view=' + e.target.value; });
  var days = document.getElementById('pv-days'), out = document.getElementById('pv-days-out');
  function syncDays() { out.textContent = 'weekdays_csv="' + Array.prototype.map.call(days.querySelectorAll('input:checked'), function (i) { return i.value; }).join(',') + '"'; }
  days.addEventListener('change', syncDays); syncDays();
  document.querySelectorAll('.ttsc-toggle-group[data-mode="buttons"]').forEach(function (g) {
    g.addEventListener('click', function (e) {
      var b = e.target.closest('button.ttsc-btn'); if (!b) return;
      var p = b.getAttribute('aria-pressed') !== 'true';
      b.setAttribute('aria-pressed', String(p)); b.classList.toggle('active', p);
    });
  });
</script>
</body>
</html>
