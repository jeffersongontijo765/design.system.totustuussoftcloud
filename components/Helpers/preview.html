<!-- @dsCard group="Base" height=330 subtitle="Helpers · TTSC.init, getOrCreateInstance, ttscData, eventos ttsc.* (payload), sr-only, truncate, kbd, escape de LIKE" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Helpers</title>
<style>
  .ttsc-sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border-width: 0; }
  .ttsc-line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  mark.ttsc-mark { background: var(--ttsc-accent-soft); color: var(--ttsc-text); border-radius: var(--ttsc-radius-xs); padding: 0 2px; }
  .pv-cols { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--ttsc-space-5) var(--ttsc-space-6); }
  .pv-log { margin: 0; padding: var(--ttsc-space-3); min-height: 120px; max-height: 150px; overflow: auto; border: 1px solid var(--ttsc-border); border-radius: var(--ttsc-radius-control); background: var(--ttsc-canvas-2); font: 11px/16px ui-monospace, monospace; color: var(--ttsc-text-2); white-space: pre-wrap; }
  .pv-res { border: 1px solid var(--ttsc-border); border-radius: var(--ttsc-radius-control); background: var(--ttsc-surface); }
  .pv-res > div { padding: 6px 10px; border-bottom: 1px solid var(--ttsc-border-soft); font-size: 13px; color: var(--ttsc-text); display: flex; justify-content: space-between; gap: 8px; }
  .pv-res > div:last-child { border-bottom: 0; }
  .pv-res small { color: var(--ttsc-text-muted); font-size: 12px; }
  .pv-code { font: 11px/16px ui-monospace, monospace; color: var(--ttsc-text-2); }
  .pv-card { width: 220px; padding: var(--ttsc-space-3); border: 1px solid var(--ttsc-border); border-radius: var(--ttsc-radius-control); font-size: 12px; color: var(--ttsc-text-2); }
</style>
</head>
<body>
<div class="ds-pad pv-cols">
  <div class="ds-stack">
    <div class="ds-label">Busca com escape de LIKE</div>
    <form class="flex items-center gap-2" id="pv-search" role="search" onsubmit="return false">
      <label class="ttsc-sr-only" for="pv-q">Buscar aluno por nome ou e-mail</label>
      <div class="ttsc-input ttsc-input-sm w-[240px]">
        <i class="fa-light fa-magnifying-glass" aria-hidden="true"></i>
        <input id="pv-q" type="search" value="a_m" autocomplete="off" placeholder="Buscar aluno">
      </div>
      <kbd class="ttsc-kbd ttsc-kbd-sm">/</kbd>
    </form>
    <div class="pv-code" id="pv-term"></div>
    <div class="pv-res" id="pv-res"></div>
    <p class="text-xs text-muted-foreground" id="pv-status" aria-live="polite"></p>
  </div>
  <div class="ds-stack">
    <div class="ds-label">Instâncias e eventos</div>
    <div class="ds-row">
      <div class="flex gap-1" data-ttsc-pin-input="true" id="pv-pin" role="group" aria-label="PIN">
        <input class="ttsc-input ttsc-input-sm w-8 text-center" data-ttsc-pin-input-item aria-label="Dígito 1">
        <input class="ttsc-input ttsc-input-sm w-8 text-center" data-ttsc-pin-input-item aria-label="Dígito 2">
        <input class="ttsc-input ttsc-input-sm w-8 text-center" data-ttsc-pin-input-item aria-label="Dígito 3">
        <input class="ttsc-input ttsc-input-sm w-8 text-center" data-ttsc-pin-input-item aria-label="Dígito 4">
      </div>
      <button type="button" class="ttsc-btn ttsc-btn-outline ttsc-btn-sm" id="pv-set">setValue('2026')</button>
      <button type="button" class="ttsc-btn ttsc-btn-ghost ttsc-btn-sm" id="pv-reinit">TTSC.init()</button>
    </div>
    <pre class="pv-log" id="pv-log" aria-live="polite"></pre>
    <div class="ds-label">CSS helpers</div>
    <div class="ds-row">
      <div class="pv-card"><span class="truncate block">truncate · Técnico em Desenvolvimento de Sistemas — Noite</span></div>
      <div class="pv-card"><span class="ttsc-line-clamp-2">line-clamp-2 (extensão) · Parecer: participa das atividades, entrega no prazo e colabora com a turma.</span></div>
    </div>
  </div>
</div>
<script>
  TTSC.init();
  var log = document.getElementById('pv-log');
  function write(line) { log.textContent = line + '\n' + log.textContent; }
  var pinEl = document.getElementById('pv-pin');
  var pin = ttscPinInput.getOrCreateInstance(pinEl);
  write('getOrCreateInstance(#pv-pin) === getInstance → ' + (pin === ttscPinInput.getInstance(pinEl)));
  write('ttscData.has(el, "pin-input") → ' + ttscData.has(pinEl, 'pin-input') + ' · data-ttsc-pin-input-initialized=' + pinEl.getAttribute('data-ttsc-pin-input-initialized'));
  pinEl.addEventListener('ttsc.pin-input.change', function (e) { var p = e.detail.payload; write('ttsc.pin-input.change payload={value:"' + p.value + '", filled:' + p.filledCount + '/' + p.cellCount + '}'); });
  pinEl.addEventListener('ttsc.pin-input.complete', function (e) { write('ttsc.pin-input.complete → "' + e.detail.payload.value + '"'); });
  document.getElementById('pv-set').addEventListener('click', function () { pin.setValue('2026'); });
  document.getElementById('pv-reinit').addEventListener('click', function () { TTSC.init(); write('TTSC.init() de novo → mesma instância: ' + (ttscPinInput.getInstance(pinEl) === pin)); });

  var students = [['Ana Beatriz Souza', 'ana.souza@escola.com.br'], ['Luana Martins', 'luana_m@escola.com.br'], ['Pedro Henrique Alves', 'pedro.alves@escola.com.br'], ['Mariana Costa Lima', 'mariana.lima@escola.com.br']];
  var q = document.getElementById('pv-q'), res = document.getElementById('pv-res');
  function escapeLike(s) { return s.replace(/[!%_]/g, function (c) { return '!' + c; }); }
  function search() {
    var raw = q.value.trim(), term = escapeLike(raw);
    document.getElementById('pv-term').textContent = ':term = "' + term + '"  →  LIKE CONCAT(\'%\', :term, \'%\') ESCAPE \'!\'';
    var hits = students.filter(function (s) { return raw && (s[0].toLowerCase().indexOf(raw.toLowerCase()) >= 0 || s[1].toLowerCase().indexOf(raw.toLowerCase()) >= 0); });
    res.replaceChildren();
    hits.forEach(function (s) {
      var row = document.createElement('div'), name = document.createElement('span'), i = s[0].toLowerCase().indexOf(raw.toLowerCase());
      if (i >= 0) { var m = document.createElement('mark'); m.className = 'ttsc-mark'; m.textContent = s[0].substr(i, raw.length); name.append(s[0].slice(0, i), m, s[0].slice(i + raw.length)); }
      else name.textContent = s[0];
      var em = document.createElement('small'); em.textContent = s[1];
      row.append(name, em); res.append(row);
    });
    if (!hits.length) { var r = document.createElement('div'); r.textContent = 'Nenhum aluno encontrado.'; res.append(r); }
    document.getElementById('pv-status').textContent = hits.length + ' alunos encontrados';
  }
  var t; q.addEventListener('input', function () { clearTimeout(t); t = setTimeout(search, 200); });
  search();
</script>
</body>
</html>
