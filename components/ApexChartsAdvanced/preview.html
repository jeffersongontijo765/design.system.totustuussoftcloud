<!-- @dsCard group="Gráficos" height=1525 width=1280 subtitle="ApexCharts 8.5.0 — candlestick, radar, treemap, waterfall, gauge radial, barras empilhadas/agrupadas e linha com faixa de previsão; tokens e tema" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ApexChartsAdvanced</title>
<style>
  html,body{margin:0;background:var(--ttsc-canvas);color:var(--ttsc-text);font-family:Inter,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  *,*::before,*::after{box-sizing:border-box}
  .axg{max-width:1280px;margin:0 auto;padding:16px;display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px;align-items:stretch}
  .ax-card{grid-column:span 5;display:flex;flex-direction:column;min-width:0;margin:0;padding:14px 16px 12px;background:var(--ttsc-surface);border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-surface);box-shadow:var(--ttsc-shadow-sm)}
  .s7{grid-column:span 7}.s5{grid-column:span 5}.s4{grid-column:span 4}.s8{grid-column:span 8}.s12{grid-column:span 12}
  .ax-hd{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
  .ax-hd h2{margin:0;font-size:14px;line-height:20px;font-weight:600;color:var(--ttsc-text)}
  .ax-hd p{margin:2px 0 0;font-size:12px;line-height:16px;color:var(--ttsc-text-muted)}
  .ax-pill{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:11px;font-weight:600;line-height:16px;padding:2px 8px;border-radius:var(--ttsc-radius-pill);border:1px solid var(--ttsc-border);color:var(--ttsc-text-2);background:var(--ttsc-surface);font-variant-numeric:tabular-nums}
  .ax-pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
  .ax-pill--ok{color:var(--ttsc-accent-text);border-color:var(--ttsc-accent-border)}
  .ax-pill--warn{color:var(--ttsc-warning-text);border-color:color-mix(in srgb,var(--ttsc-warning) 45%,transparent)}
  .ax-chart{min-width:0;width:100%}
  .ax-note{margin:4px 0 0;font-size:11px;line-height:16px;color:var(--ttsc-text-muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tnum{font-variant-numeric:tabular-nums}
  .ax-tip{min-width:150px;padding:9px 11px;font-size:12px;line-height:18px;color:var(--ttsc-text);background:var(--ttsc-surface);border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-sm);box-shadow:var(--ttsc-shadow-popover)}
  .ax-tip-t{font-weight:600;font-size:12px;color:var(--ttsc-text);margin-bottom:4px}
  .ax-tip-r{display:flex;justify-content:space-between;gap:18px;color:var(--ttsc-text-2)}
  .ax-tip-r b{font-weight:600;color:var(--ttsc-text);font-variant-numeric:tabular-nums}
  .ax-tip-r b.up{color:var(--ttsc-accent-text)}
  .ax-tip-r b.down{color:var(--ttsc-danger-text)}
  .ax-tip-s{margin-top:5px;padding-top:5px;border-top:1px solid var(--ttsc-border-soft);font-size:11px;color:var(--ttsc-text-muted)}
  /* Apex: tooltip e legenda nos tokens (os dois temas) */
  .apexcharts-tooltip.apexcharts-theme-light,.apexcharts-tooltip.apexcharts-theme-dark{background:var(--ttsc-surface)!important;color:var(--ttsc-text)!important;border:1px solid var(--ttsc-border)!important;box-shadow:var(--ttsc-shadow-popover)!important;border-radius:var(--ttsc-radius-sm)!important}
  .apexcharts-tooltip.apexcharts-theme-light .apexcharts-tooltip-title,.apexcharts-tooltip.apexcharts-theme-dark .apexcharts-tooltip-title{background:var(--ttsc-canvas-2)!important;border-bottom:1px solid var(--ttsc-border)!important;color:var(--ttsc-text-2)!important}
  .apexcharts-legend-text{color:var(--ttsc-text-2)!important}
  .apexcharts-legend .apexcharts-legend-series .apexcharts-legend-text{font-size:11px!important;font-weight:500!important}
  /* O bundle força legendas em coluna; nas galerias de gráfico a leitura é horizontal. */
  .apexcharts-legend.apx-legend-position-top,.apexcharts-legend.apx-legend-position-bottom{flex-direction:row!important;flex-wrap:wrap;align-items:center;gap:6px 2px}
  .apexcharts-legend.apx-legend-position-top .apexcharts-legend-series,.apexcharts-legend.apx-legend-position-bottom .apexcharts-legend-series{margin:0 12px 0 0!important}
  .apexcharts-xaxistooltip,.apexcharts-yaxistooltip{background:var(--ttsc-surface)!important;border-color:var(--ttsc-border)!important;color:var(--ttsc-text)!important}
  /* Segmentado */
  .seg{display:inline-flex;gap:2px;padding:2px;border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-pill);background:var(--ttsc-surface-2);flex-shrink:0}
  .seg button{appearance:none;border:0;background:transparent;color:var(--ttsc-text-muted);font:600 11px/16px Inter,system-ui,sans-serif;padding:5px 10px;border-radius:var(--ttsc-radius-pill);cursor:pointer;transition:background .15s,color .15s}
  .seg button:hover{color:var(--ttsc-text)}
  .seg button[aria-pressed="true"]{background:var(--ttsc-surface);color:var(--ttsc-text);box-shadow:var(--ttsc-shadow-sm)}
  :focus-visible{outline:2px solid var(--ttsc-accent);outline-offset:2px}
  /* Waterfall: legenda própria */
  .wf-legend{display:flex;flex-wrap:wrap;gap:12px;margin:2px 0 0;font-size:11px;line-height:16px;color:var(--ttsc-text-muted)}
  .wf-legend span{display:inline-flex;align-items:center;gap:5px}
  .wf-legend i{width:8px;height:8px;border-radius:2px;display:inline-block;background:var(--c)}
  /* Treemap: rótulos HTML sincronizados com os retângulos */
  .tm-wrap{position:relative;width:100%}
  .tm-labels{position:absolute;inset:0;pointer-events:none}
  .tm-lab{position:absolute;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:2px 4px;color:var(--ttsc-text);line-height:1.15}
  .tm-lab b{font-size:11px;font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tm-lab span{font-size:10px;color:var(--ttsc-text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tm-lab.sm b{font-size:10px}.tm-lab.sm span{font-size:9px}
  /* Gauge */
  .g-meta{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:-6px;font-size:11px;color:var(--ttsc-text-muted);flex-wrap:wrap}
  .g-meta b{color:var(--ttsc-warning-text);font-weight:600}
  .ax-radar-legend{justify-content:center;gap:14px}
  .lg{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--ttsc-text-2)}
  .lg i{width:8px;height:8px;border-radius:2px;background:var(--c)}
  /* Tabela alternativa */
  .ax-details{margin-top:8px;border-top:1px solid var(--ttsc-border-soft);padding-top:6px}
  .ax-details summary{cursor:pointer;font-size:11px;font-weight:600;color:var(--ttsc-text-2);list-style:none;display:inline-flex;align-items:center;gap:6px;padding:3px 0}
  .ax-details summary::-webkit-details-marker{display:none}
  .ax-details summary::before{content:"\f0ce";font-family:"Font Awesome 7 Pro";font-weight:300;font-size:10px;color:var(--ttsc-text-muted)}
  .ax-details[open] summary::before{content:"\f0d7"}
  .ax-table-wrap{overflow-x:auto;margin:6px 0 2px;border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-sm);max-width:100%}
  .ax-table{width:100%;border-collapse:collapse;font-size:11px;line-height:16px;font-variant-numeric:tabular-nums}
  .ax-table th,.ax-table td{padding:5px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--ttsc-border-soft)}
  .ax-table th{font-weight:600;color:var(--ttsc-text-muted);background:var(--ttsc-surface-2);position:sticky;top:0}
  .ax-table th:first-child,.ax-table td:first-child{text-align:left}
  .ax-table tbody tr:last-child td{border-bottom:0}
  .ax-table td{color:var(--ttsc-text-2)}
  .ax-table td b{color:var(--ttsc-text);font-weight:600}
  @media (max-width:1024px){
    .ax-card,.s7,.s4,.s8{grid-column:span 12}
    .axg{gap:12px}
  }
  @media (max-width:560px){
    .axg{padding:12px;gap:10px}
    .ax-card{padding:12px}
    .ax-hd{flex-wrap:wrap}
    .ax-hd h2{font-size:13px}
    .seg button{padding:6px 9px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
</style>
</head>
<body>
<div class="axg">

  <figure class="ax-card s7">

    <p class="wf-legend"><span style="--c:var(--ttsc-success)"><i></i>Aumento</span><span style="--c:var(--ttsc-danger)"><i></i>Redução</span><span style="--c:var(--ttsc-accent)"><i></i>Total</span></p>

</div>
<script>
if (window.TTSC) TTSC.init();

var AXP = { charts: [], tm: null, tmRows: [], observer: null, ro: null, wired: false };
var RM = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- tokens e formatadores ---------- */
function isDark() {
  var el = document.documentElement;
  return el.getAttribute('data-theme') === 'dark' || el.classList.contains('dark');
}
function readTokens() {
  var cs = getComputedStyle(document.documentElement);
  var t = function (n) { return cs.getPropertyValue(n).trim(); };
  var c = function (n) { return cssColor(t(n)); };
  return {
    dark: isDark(),
    accent: c('--ttsc-accent'), accentOn: c('--ttsc-accent-on'), accentText: c('--ttsc-accent-text'),
    success: c('--ttsc-success'), warning: c('--ttsc-warning'), danger: c('--ttsc-danger'), info: c('--ttsc-info'),
    p200: c('--ttsc-primary-200'), p300: c('--ttsc-primary-300'), p400: c('--ttsc-primary-400'),
    p700: c('--ttsc-primary-700'), p800: c('--ttsc-primary-800'),
    surface: c('--ttsc-surface'), surface2: c('--ttsc-surface-2'), canvas: c('--ttsc-canvas'),
    text: c('--ttsc-text'), text2: c('--ttsc-text-2'), muted: c('--ttsc-text-muted'),
    border: c('--ttsc-border'), borderSoft: c('--ttsc-border-soft')
  };
}
/* Tokens registrados com @property chegam em oklch; o Apex precisa de hex/rgb para calcular sombras. */
function cssColor(v) {
  if (!v) return v;
  if (v.indexOf('oklch(') === 0) return oklchToHex(v);
  return v;
}
function oklchToHex(str) {
  var m = str.match(/oklch\(\s*([\d.]+%?)\s+([\d.]+)\s+([\d.]+)(?:deg)?(?:\s*\/\s*([\d.]+%?))?\s*\)/);
  if (!m) return str;
  var L = m[1].slice(-1) === '%' ? parseFloat(m[1]) / 100 : parseFloat(m[1]);
  var Cc = parseFloat(m[2]);
  var h = parseFloat(m[3]) * Math.PI / 180;
  var A = Cc * Math.cos(h), B = Cc * Math.sin(h);
  var l_ = L + 0.3963377774 * A + 0.2158037573 * B;
  var m_ = L - 0.1055613458 * A - 0.0638541728 * B;
  var s_ = L - 0.0894841775 * A - 1.2914855480 * B;
  var l = l_ * l_ * l_, mm = m_ * m_ * m_, s = s_ * s_ * s_;
  var r = 4.0767416621 * l - 3.3077115913 * mm + 0.2309699292 * s;
  var g = -1.2684380046 * l + 2.6097574011 * mm - 0.3413193965 * s;
  var b = -0.0041960863 * l - 0.7034186147 * mm + 1.7076147010 * s;
  var enc = function (x) {
    x = x <= 0.0031308 ? 12.92 * x : 1.055 * Math.pow(x, 1 / 2.4) - 0.055;
    return Math.max(0, Math.min(255, Math.round(x * 255)));
  };
  return '#' + [enc(r), enc(g), enc(b)].map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
}
var NF0 = new Intl.NumberFormat('pt-BR');
var NF1 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
var NF2 = new Intl.NumberFormat('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
function pct1(v) { return NF1.format(v) + '%'; }
function pct2(v) { return NF2.format(v) + '%'; }
function brlMil(v) { return 'R$ ' + NF0.format(v) + ' mil'; }
function money(v) { return 'US$ ' + NF0.format(v); }
function fmtDate(ts) {
  return new Date(ts).toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
/* mistura dois hex/rgb — usada no treemap e nas faixas */
function toRgb(c) {
  if (c.charAt(0) === '#') {
    var h = c.slice(1);
    if (h.length === 3) h = h.charAt(0) + h.charAt(0) + h.charAt(1) + h.charAt(1) + h.charAt(2) + h.charAt(2);
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  }
  var m = c.match(/[\d.]+/g);
  return m ? [+m[0], +m[1], +m[2]] : [0, 0, 0];
}
function mix(a, b, w) {
  var A = toRgb(a), B = toRgb(b);
  var h = function (x) { return Math.round(x).toString(16).padStart(2, '0'); };
  return '#' + h(A[0] * w + B[0] * (1 - w)) + h(A[1] * w + B[1] * (1 - w)) + h(A[2] * w + B[2] * (1 - w));
}
/* texto pequeno em vermelho precisa clarear no tema escuro (contraste >= 4,5:1) */
function dangerText(C) {
  return C.dark ? mix('#ffffff', C.danger, 0.45) : C.danger;
}
function treemapColors(C) {
  var w = C.dark ? [0.10, 0.15, 0.20, 0.25, 0.30, 0.35, 0.40, 0.45] : [0.22, 0.33, 0.44, 0.55, 0.66, 0.77, 0.88, 0.96];
  return w.map(function (x) { return mix(C.accent, C.surface, x); });
}

/* ---------- base do Apex ---------- */
function apexBase(C) {
  return {
    chart: {
      fontFamily: 'Inter, system-ui, sans-serif', foreColor: C.muted, background: 'transparent',
      toolbar: { show: false }, zoom: { enabled: false },
      animations: { enabled: !RM, speed: 420 },
      defaultLocale: 'pt-br',
      locales: [{
        name: 'pt-br', options: {
          months: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'],
          shortMonths: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],
          days: ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'],
          shortDays: ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'],
          toolbar: { download: 'Baixar SVG', selection: 'Selecionar', selectionZoom: 'Zoom', zoomIn: 'Ampliar', zoomOut: 'Reduzir', pan: 'Mover', reset: 'Restaurar' }
        }
      }]
    },
    theme: { mode: C.dark ? 'dark' : 'light' },
    tooltip: { theme: C.dark ? 'dark' : 'light' },
    grid: { borderColor: C.border, strokeDashArray: 3 },
    dataLabels: { enabled: false },
    legend: { labels: { colors: C.text2 }, fontSize: '12px' }
  };
}
function axis(C) {
  return {
    labels: { style: { colors: C.muted, fontSize: '11px' } },

  if (!group) return;
  var status = document.getElementById('ax-mode-status');
  group.addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-mode]');
    if (!btn) return;
    var stacked = btn.getAttribute('data-mode') === 'stacked';
    group.querySelectorAll('button').forEach(function (b) {
      b.setAttribute('aria-pressed', b === btn ? 'true' : 'false');
    });
    if (AXP.stacked) {
      AXP.stacked.updateOptions({ chart: { stacked: stacked } }, true, false);
    }
    if (status) status.textContent = stacked ? 'Modo empilhado.' : 'Modo agrupado.';
  });
}
function observeTheme() {
  if (AXP.observer) AXP.observer.disconnect();
  AXP.observer = new MutationObserver(function () {
    AXP.charts.forEach(function (c) {
      try {
        c.chart.updateOptions(c.theme(), true, false);
        if (c.after) c.after();
      } catch (e) { /* gráfico desmontado */ }
    });
  });
  AXP.observer.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme', 'class'] });
}
function observeResize() {
  var wrap = document.getElementById('tm-wrap');
  if (!wrap || !('ResizeObserver' in window)) return;
  if (AXP.ro) AXP.ro.disconnect();
  var raf = 0;
  AXP.ro = new ResizeObserver(function () {
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(layoutTreemapLabels);
  });
  AXP.ro.observe(wrap);
}

/* API do preview: monta os sete gráficos e permite desmontar sem recarregar. */
window.TTSCChartsAdvanced = {
  init: function () {
    if (!AXP.charts.length) renderAll();
    return window.TTSCChartsAdvanced;
  },
  destroy: function () {
    AXP.charts.forEach(function (c) { try { c.chart.destroy(); } catch (e) { /* já removido */ } });
    AXP.charts = []; AXP.tm = null; AXP.stacked = null;
    var layer = document.getElementById('tm-labels');
    if (layer) layer.innerHTML = '';
    if (AXP.observer) { AXP.observer.disconnect(); AXP.observer = null; }
    if (AXP.ro) { AXP.ro.disconnect(); AXP.ro = null; }
    return window.TTSCChartsAdvanced;
  },
  charts: function () { return AXP.charts.map(function (c) { return c.chart; }); },
  relayout: layoutTreemapLabels
};

var apex = document.createElement('script');
apex.src = '../../vendor/apexcharts/apexcharts.min.js';
apex.onload = renderAll;
document.head.appendChild(apex);
</script>
