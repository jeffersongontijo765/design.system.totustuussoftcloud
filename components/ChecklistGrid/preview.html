<!-- @dsCard group="Componentes" height=316 subtitle="Checklist em grade com progresso e estado por item" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ChecklistGrid</title>
<style>
  html,body{margin:0;background:var(--ttsc-canvas);color:var(--ttsc-text);font-family:Inter,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .demo{padding:16px;display:grid;gap:14px;max-width:1100px}
  .card{background:var(--ttsc-surface);border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-surface);padding:16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .card-t{margin:0;font-size:14px;font-weight:600;color:var(--ttsc-text)}
  .card-s{margin:2px 0 0;font-size:11px;color:var(--ttsc-text-muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--ttsc-radius-pill);border:1px solid var(--ttsc-border);color:var(--ttsc-text-2);white-space:nowrap;background:var(--ttsc-surface)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill-ok{color:var(--ttsc-success);border-color:color-mix(in srgb,var(--ttsc-success) 40%,transparent)}
  .pill-warn{color:var(--ttsc-warning-text);border-color:color-mix(in srgb,var(--ttsc-warning) 45%,transparent)}
  .pill-bad{color:var(--ttsc-danger-text);border-color:color-mix(in srgb,var(--ttsc-danger) 40%,transparent)}
  .pill-info{color:var(--ttsc-info-text);border-color:color-mix(in srgb,var(--ttsc-info) 40%,transparent)}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ttsc-accent-soft);color:var(--ttsc-accent-text);flex-shrink:0}
  .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--ttsc-border);background:var(--ttsc-surface);display:grid;place-items:center;color:var(--ttsc-text-2);cursor:pointer}
  .ib:hover{background:var(--ttsc-canvas-2)}
  .ib-ok:hover{color:var(--ttsc-success)} .ib-no:hover{color:var(--ttsc-danger-text)}
  .muted{color:var(--ttsc-text-muted)} .tnum{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--ttsc-accent);outline-offset:2px}

  .check-head{display:grid;gap:6px;margin-bottom:12px}
  .check-count{display:flex;justify-content:space-between;font-size:12px;color:var(--ttsc-text-2)}
  .check-count b{font-variant-numeric:tabular-nums;color:var(--ttsc-text)}
  .check-track{height:6px;border-radius:var(--ttsc-radius-pill);background:var(--ttsc-surface-2);overflow:hidden}
  .check-track i{display:block;height:100%;width:calc(var(--p) * 1%);background:var(--ttsc-accent);border-radius:inherit}
  .checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
  .check{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;padding:12px;border-radius:var(--ttsc-radius-control);border:1px solid var(--ttsc-border-soft);background:var(--ttsc-surface);align-items:start}
  .check-ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--ttsc-surface-2);color:var(--ttsc-text-muted)}
  .check.done .check-ic{background:color-mix(in srgb,var(--ttsc-success) 18%,var(--ttsc-surface));color:var(--ttsc-success)}
  .check.wait .check-ic{background:color-mix(in srgb,var(--ttsc-warning) 18%,var(--ttsc-surface));color:var(--ttsc-warning-text)}
  .check.done{background:color-mix(in srgb,var(--ttsc-success) 6%,var(--ttsc-surface))}
  .check-title{font-weight:600;font-size:13px;color:var(--ttsc-text)}
  .check-meta{font-size:11px;color:var(--ttsc-text-muted);margin-top:2px}
</style>
</head>
<body>
<main class="demo">

  <section class="card" aria-labelledby="ck-t">
    <div class="card-h">
      <div><h2 id="ck-t" class="card-t">Fechamento do mês · outubro</h2><p class="card-s">Cada item é uma verificação que a equipe confirma</p></div>
      <span class="pill pill-warn">Faltam 3 dias</span>
    </div>
    <div class="check-head">
      <div class="check-count"><span>Concluídas</span><b>6 de 9</b></div>
      <div class="check-track" role="progressbar" aria-valuemin="0" aria-valuemax="9" aria-valuenow="6" aria-label="Itens concluídos: 6 de 9"><i style="--p:67"></i></div>
    </div>
    <div class="checks">
      <div class="check done"><span class="check-ic"><i class="fa-light fa-check" aria-hidden="true"></i></span>
        <div><div class="check-title">Frequência lançada</div><div class="check-meta">Concluído por Ana · 20/10</div></div></div>
      <div class="check done"><span class="check-ic"><i class="fa-light fa-check" aria-hidden="true"></i></span>
        <div><div class="check-title">Cobranças geradas</div><div class="check-meta">Concluído por Rui · 21/10</div></div></div>
      <div class="check wait"><span class="check-ic"><i class="fa-light fa-clock" aria-hidden="true"></i></span>
        <div><div class="check-title">Conciliação bancária</div><div class="check-meta">Pendente: 4 lançamentos sem par</div></div></div>
      <div class="check"><span class="check-ic"><i class="fa-light fa-circle" aria-hidden="true"></i></span>
        <div><div class="check-title">Turmas sem chamada hoje</div><div class="check-meta">3 turmas ativas</div></div></div>
    </div>
  </section>

</main>
</body>
</html>
