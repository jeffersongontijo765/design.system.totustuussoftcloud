<!-- @dsCard group="Componentes" height=290 subtitle="ProfileHeader · profile header com estados, ações e acessibilidade (padrões de referência adaptados) " -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>ProfileHeader</title>
<style>
  html,body{margin:0;background:var(--ttsc-canvas);color:var(--ttsc-text);font-family:Inter,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .demo{padding:16px;display:grid;gap:14px;max-width:1100px}
  .card{background:var(--ttsc-surface);border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-surface);padding:16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .card-t{margin:0;font-size:14px;font-weight:600;color:var(--ttsc-text)}
  .card-s{margin:2px 0 0;font-size:11px;color:var(--ttsc-text-muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--ttsc-radius-pill);border:1px solid var(--ttsc-border);color:var(--ttsc-text-2);white-space:nowrap;background:var(--ttsc-surface)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill-ok{color:var(--ttsc-success);border-color:color-mix(in srgb,var(--ttsc-success) 40%,transparent)}
  .pill-warn{color:var(--ttsc-warning-text);border-color:color-mix(in srgb,var(--ttsc-warning) 45%,transparent)}
  .pill-bad{color:var(--ttsc-danger-text);border-color:color-mix(in srgb,var(--ttsc-danger) 40%,transparent)}
  .pill-info{color:var(--ttsc-info-text);border-color:color-mix(in srgb,var(--ttsc-info) 40%,transparent)}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ttsc-accent-soft);color:var(--ttsc-accent-text);flex-shrink:0}
  .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--ttsc-border);background:var(--ttsc-surface);display:grid;place-items:center;color:var(--ttsc-text-2);cursor:pointer}
  .ib:hover{background:var(--ttsc-canvas-2)}
  .ib-ok:hover{color:var(--ttsc-success)} .ib-no:hover{color:var(--ttsc-danger-text)}
  .muted{color:var(--ttsc-text-muted)} .tnum{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--ttsc-accent);outline-offset:2px}

  .ph{border-radius:var(--ttsc-radius-surface);border:1px solid var(--ttsc-border);background:var(--ttsc-surface);overflow:hidden}
  .ph-cover{height:86px;background:linear-gradient(120deg,var(--ttsc-accent-soft),var(--ttsc-canvas-2))}
  .ph-body{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:end;padding:0 18px 16px}
  .ph-avatar{width:74px;height:74px;border-radius:50%;margin-top:-37px;border:4px solid var(--ttsc-surface);display:grid;place-items:center;font-size:20px;font-weight:700;background:var(--ttsc-accent-soft);color:var(--ttsc-accent-text)}
  .ph-name{margin:0;font-size:18px;font-weight:700;color:var(--ttsc-text)}
  .ph-role{font-size:12px;color:var(--ttsc-text-muted);margin-top:2px}
  .ph-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .ph-stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border-top:1px solid var(--ttsc-border);font-size:12px}
  .ph-stats>div{padding:12px 18px;border-right:1px solid var(--ttsc-border-soft)}
  .ph-stats>div:last-child{border-right:0}
  .ph-stats b{display:block;font-size:18px;color:var(--ttsc-text);font-variant-numeric:tabular-nums}
  .ph-stats span{color:var(--ttsc-text-muted)}
  @media (max-width:640px){.ph-body{grid-template-columns:1fr}.ph-acts{justify-self:start}}
</style>
</head>
<body>
<main class="demo">

  <section class="ph" aria-labelledby="ph-t">
    <div class="ph-cover" aria-hidden="true"></div>
    <div class="ph-body">
      <span class="ph-avatar" aria-hidden="true">AS</span>
      <div>
        <h2 id="ph-t" class="ph-name">Ana Souza</h2>
        <div class="ph-role">Aluna · 2º ano B · Matrícula 2027-0412</div>
        <div class="ph-tags"><span class="pill pill-ok">Matrícula ativa</span><span class="pill pill-info">Turno da manhã</span><span class="pill pill-warn">1 documento em análise</span></div>
      </div>
      <div class="ph-acts"><button class="pc-btn" type="button" style="width:auto">Editar dados</button></div>
    </div>
    <div class="ph-stats">
      <div><b>92%</b><span>Frequência</span></div>
      <div><b>8,4</b><span>Média geral</span></div>
      <div><b>Em dia</b><span>Mensalidades</span></div>
    </div>
  </section>

</main>
</body>
</html>
