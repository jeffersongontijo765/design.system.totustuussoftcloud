<!-- @dsCard group="Componentes" height=300 subtitle="TestimonialCard · testimonial com estados, ações e acessibilidade (padrões de referência adaptados) " -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>TestimonialCard</title>
<style>
  html,body{margin:0;background:var(--ttsc-canvas);color:var(--ttsc-text);font-family:Inter,system-ui,sans-serif;font-size:13px;-webkit-font-smoothing:antialiased}
  .demo{padding:16px;display:grid;gap:14px;max-width:1100px}
  .card{background:var(--ttsc-surface);border:1px solid var(--ttsc-border);border-radius:var(--ttsc-radius-surface);padding:16px}
  .card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
  .card-t{margin:0;font-size:14px;font-weight:600;color:var(--ttsc-text)}
  .card-s{margin:2px 0 0;font-size:11px;color:var(--ttsc-text-muted)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:var(--ttsc-radius-pill);border:1px solid var(--ttsc-border);color:var(--ttsc-text-2);white-space:nowrap;background:var(--ttsc-surface)}
  .pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
  .pill-ok{color:var(--ttsc-success);border-color:color-mix(in srgb,var(--ttsc-success) 40%,transparent)}
  .pill-warn{color:var(--ttsc-warning-text);border-color:color-mix(in srgb,var(--ttsc-warning) 45%,transparent)}
  .pill-bad{color:var(--ttsc-danger-text);border-color:color-mix(in srgb,var(--ttsc-danger) 40%,transparent)}
  .pill-info{color:var(--ttsc-info-text);border-color:color-mix(in srgb,var(--ttsc-info) 40%,transparent)}
  .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--ttsc-accent-soft);color:var(--ttsc-accent-text);flex-shrink:0}
  .ib{width:30px;height:30px;border-radius:8px;border:1px solid var(--ttsc-border);background:var(--ttsc-surface);display:grid;place-items:center;color:var(--ttsc-text-2);cursor:pointer}
  .ib:hover{background:var(--ttsc-canvas-2)}
  .ib-ok:hover{color:var(--ttsc-success)} .ib-no:hover{color:var(--ttsc-danger-text)}
  .muted{color:var(--ttsc-text-muted)} .tnum{font-variant-numeric:tabular-nums}
  :focus-visible{outline:2px solid var(--ttsc-accent);outline-offset:2px}

  .te-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .te{display:grid;gap:10px;padding:16px;border-radius:var(--ttsc-radius-surface);border:1px solid var(--ttsc-border);background:var(--ttsc-surface);margin:0}
  .te blockquote{margin:0;font-size:14px;line-height:1.55;color:var(--ttsc-text)}
  .te-stars{display:flex;gap:2px;color:var(--ttsc-warning-text);font-size:12px}
  .te-who{display:flex;gap:10px;align-items:center}
  .te-name{font-size:13px;font-weight:600;color:var(--ttsc-text)}
  .te-role{font-size:11px;color:var(--ttsc-text-muted)}
  @media (max-width:640px){.te-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="demo">

  <section aria-labelledby="te-t">
    <h2 id="te-t" class="card-t" style="margin:0 0 10px">O que as famílias dizem</h2>
    <div class="te-grid">
      <figure class="te">
        <div class="te-stars" role="img" aria-label="Avaliação: 5 de 5"><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i></div>
        <blockquote>“Meu filho entrou no 1º ano sem medo. A secretaria respondeu no mesmo dia e o acompanhamento de reforço fez diferença.”</blockquote>
        <figcaption class="te-who"><span class="av" aria-hidden="true">MO</span><span><span class="te-name">Marina Oliveira</span><br><span class="te-role">Responsável · 1º ano A</span></span></figcaption>
      </figure>
      <figure class="te">
        <div class="te-stars" role="img" aria-label="Avaliação: 4 de 5"><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-solid fa-star" aria-hidden="true"></i><i class="fa-regular fa-star" aria-hidden="true"></i></div>
        <blockquote>“O boleto chega com antecedência e o portal mostra tudo o que foi pago. Só sinto falta de um aviso antes do vencimento.”</blockquote>
        <figcaption class="te-who"><span class="av" aria-hidden="true">RL</span><span><span class="te-name">Rafael Lima</span><br><span class="te-role">Responsável · 3º ano B</span></span></figcaption>
      </figure>
    </div>
  </section>

</main>
</body>
</html>
