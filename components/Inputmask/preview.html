<!-- @dsCard group="Formulários · Plugins" height=370 subtitle="Inputmask 5.0.9 · CPF, CNPJ, telefone (8/9 dígitos), CEP, moeda R$, data · valor sem máscara" -->
<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><title>Inputmask</title>
<script src="../../vendor/inputmask/inputmask.min.js"></script>
<style>
  .im-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px 16px; }
  .im-field { display: flex; flex-direction: column; gap: 6px; }
  .im-field label { font-size: 13px; font-weight: 500; color: var(--ttsc-text); }
  .im-raw { font-family: var(--font-mono, monospace); font-size: 12px; color: var(--ttsc-text-muted); min-height: 16px; }
  .im-raw b { font-weight: 500; color: var(--ttsc-text-2); }
  .im-err { font-size: 12px; color: var(--ttsc-danger-text); }
  .ttsc-input { font-variant-numeric: tabular-nums; }
  @media (max-width: 640px) { .im-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="ds-pad ds-stack">
  <div class="ds-label">Cadastro de aluno e responsável financeiro</div>
  <div class="im-grid">
    <div class="im-field">
      <label for="im-cpf">CPF</label>
      <input class="ttsc-input" id="im-cpf" name="cpf" value="52998224725" data-ttsc-mask="cpf" inputmode="numeric" aria-describedby="raw-cpf">
      <span class="im-raw" id="raw-cpf"></span>
    </div>
    <div class="im-field">
      <label for="im-cnpj">CNPJ do responsável</label>
      <input class="ttsc-input" id="im-cnpj" name="cnpj" value="11222333000181" data-ttsc-mask="cnpj" inputmode="numeric" aria-describedby="raw-cnpj">
      <span class="im-raw" id="raw-cnpj"></span>
    </div>
    <div class="im-field">
      <label for="im-phone">Celular</label>
      <input class="ttsc-input" id="im-phone" name="phone" value="31987654321" data-ttsc-mask="phone" inputmode="tel" aria-describedby="raw-phone">
      <span class="im-raw" id="raw-phone"></span>
    </div>
    <div class="im-field">
      <label for="im-cep">CEP</label>
      <input class="ttsc-input" id="im-cep" name="zip_code" value="30130010" data-ttsc-mask="cep" inputmode="numeric" aria-describedby="raw-cep">
      <span class="im-raw" id="raw-cep"></span>
    </div>
    <div class="im-field">
      <label for="im-money">Mensalidade</label>
      <input class="ttsc-input" id="im-money" name="gross_amount" value="1250,50" data-ttsc-mask="money" inputmode="decimal" aria-describedby="raw-money">
      <span class="im-raw" id="raw-money"></span>
    </div>
    <div class="im-field">
      <label for="im-date">Data de nascimento</label>
      <input class="ttsc-input" id="im-date" name="birth_date" value="14032008" data-ttsc-mask="date" inputmode="numeric" aria-describedby="raw-date">
      <span class="im-raw" id="raw-date"></span>
    </div>
  </div>
  <div class="ds-label">Incompleto / inválido</div>
  <div class="im-grid">
    <div class="im-field">
      <label for="im-cpf-bad">CPF</label>
      <input class="ttsc-input" id="im-cpf-bad" name="cpf_bad" value="11111111111" data-ttsc-mask="cpf" inputmode="numeric" aria-invalid="true" aria-describedby="err-cpf">
      <span class="im-err" id="err-cpf">CPF inválido: dígitos verificadores não conferem.</span>
    </div>
    <div class="im-field">
      <label for="im-phone-bad">Telefone</label>
      <input class="ttsc-input" id="im-phone-bad" name="phone_bad" value="3198" data-ttsc-mask="phone" inputmode="tel" aria-invalid="true" aria-describedby="err-phone">
      <span class="im-err" id="err-phone">Telefone incompleto.</span>
    </div>
  </div>
</div>
<script>
TTSC.init();
var TTSC_MASKS = {
  cpf:   { mask: '999.999.999-99', placeholder: '_', clearIncomplete: false },
  cnpj:  { mask: '99.999.999/9999-99' },
  phone: { mask: ['(99) 9999-9999', '(99) 99999-9999'], keepStatic: true },
  cep:   { mask: '99999-999' },
  money: { alias: 'currency', prefix: 'R$ ', groupSeparator: '.', radixPoint: ',', digits: 2, digitsOptional: false, rightAlign: false, unmaskAsNumber: true },
  date:  { alias: 'datetime', inputFormat: 'dd/mm/yyyy', outputFormat: 'yyyy-mm-dd', placeholder: 'dd/mm/aaaa' }
};
function cpfValid(d) {
  if (!/^\d{11}$/.test(d) || /^(\d)\1{10}$/.test(d)) return false;
  for (var t = 9; t < 11; t++) {
    var s = 0; for (var i = 0; i < t; i++) s += +d[i] * (t + 1 - i);
    if (((s * 10) % 11) % 10 !== +d[t]) return false;
  }
  return true;
}
document.querySelectorAll('[data-ttsc-mask]').forEach(function (el) {
  Inputmask(TTSC_MASKS[el.dataset.ttscMask]).mask(el);
  var raw = document.getElementById('raw-' + el.id.replace('im-', ''));
  function show() {
    if (!raw) return;
    var v = el.inputmask.unmaskedvalue();
    raw.innerHTML = 'enviado: <b>' + (v === '' ? '—' : v) + '</b>' + (el.inputmask.isComplete() ? '' : ' · incompleto');
  }
  el.addEventListener('input', show); show();
});
['im-cpf', 'im-cpf-bad'].forEach(function (id) {
  var el = document.getElementById(id);
  el.addEventListener('blur', function () { el.setAttribute('aria-invalid', cpfValid(el.inputmask.unmaskedvalue()) ? 'false' : 'true'); });
});
</script>
</body>
</html>
